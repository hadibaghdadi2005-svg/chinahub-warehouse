<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAGHDEDI Warehouse System</title>
<meta name="description" content="Sign-in and staff control for the BAGHDEDI consolidation warehouse.">
<meta name="theme-color" content="#1f2d6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChinaHub">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Only the label screens draw barcodes, so this must not hold up the page. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
/* Shown the moment the page opens, until the app draws over it. */
#boot-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f6f7fb;color:#1f2d6e;font:600 15px/1.4 system-ui,sans-serif}
#boot-splash img{width:72px;height:72px;border-radius:18px}
#boot-splash i{width:28px;height:28px;border:3px solid #d6dbef;border-top-color:#1f2d6e;border-radius:50%;animation:bs .8s linear infinite}
@keyframes bs{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){#boot-splash{background:#10142a;color:#dfe4ff}#boot-splash i{border-color:#2a3157;border-top-color:#dfe4ff}}
</style>
</head>
<body>
<div id="app"><div id="boot-splash"><img src="icon-192.png" alt=""><i></i><span>Opening the warehouse…</span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
<script>
/* If the app has not drawn anything after 10 seconds (an old browser, a
   blocked script, no internet), say so on screen with the browser version,
   instead of leaving a blank page. Plain old JavaScript on purpose, so even
   a browser too old for the app can run it. */
(function () {
  var errs = [];
  window.addEventListener("error", function (e) {
    errs.push((e && (e.message || (e.target && e.target.src))) || "unknown error");
  }, true);
  setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || (app.children.length && !document.getElementById("boot-splash"))) return;
    app.replaceChildren ? app.replaceChildren() : (app.innerHTML = "");
    var ua = navigator.userAgent;
    var m = ua.match(/Chrom(?:e|ium)\/(\d+)/);
    var chrome = m ? parseInt(m[1], 10) : 0;
    var old = chrome && chrome < 85;
    var box = document.createElement("div");
    box.setAttribute("style", "font:16px/1.5 sans-serif;padding:24px;max-width:560px;margin:0 auto;color:#111;background:#fff");
    function line(tag, text, style) {
      var el = document.createElement(tag);
      el.appendChild(document.createTextNode(text));
      if (style) el.setAttribute("style", style);
      box.appendChild(el);
    }
    line("h2", "The warehouse app could not start", "margin:0 0 10px;font-size:20px");
    if (!navigator.onLine) line("p", "This device has no internet connection. Connect to Wi-Fi and reload.");
    else if (old) line("p", "This browser is too old for the app (Chrome " + chrome + "). Update Chrome and Android System WebView from the Play Store, then reload.");
    else line("p", "Something stopped the app from loading. Send a photo of this screen to whoever looks after the app.");
    line("p", "Browser: " + (chrome ? "Chrome " + chrome : "not Chrome"), "margin:14px 0 4px;font-weight:bold");
    line("p", ua, "font:12px monospace;word-break:break-all;color:#555;margin:0");
    if (errs.length) line("p", "Errors: " + errs.slice(0, 4).join(" | "), "font:12px monospace;word-break:break-all;color:#a00;margin-top:10px");
    var b = document.createElement("button");
    b.appendChild(document.createTextNode("Reload"));
    b.setAttribute("style", "margin-top:16px;padding:12px 20px;font-size:16px");
    b.onclick = function () { location.reload(); };
    box.appendChild(b);
    app.appendChild(box);
  }, 10000);
})();
</script>
</body>
</html>
