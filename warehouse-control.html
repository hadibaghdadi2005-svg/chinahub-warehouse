/* Pricing from the lane rates. Unlike the ￥ rebuild this can reach parcels
   that were never billed at all, which is the whole point for goods still on
   the way: they arrive with a weight and a route but no amount. */
function askLanePrice(){
  const todo = allItems().filter(it => laneCost(it) != null);
  if(!todo.length){ toast("No items fall in a lane that has a price.","bad"); return; }
  const before = todo.reduce((s,i) => s + (Number(i.cost)||0), 0);
  const after  = todo.reduce((s,i) => s + laneCost(i), 0);
  const unbilled = todo.filter(it => !(Number(it.cost) > 0)).length;
  const byLane = new Map();
  for(const it of todo){ const L = laneFor(it); const k = L.label || L.match;
    byLane.set(k, (byLane.get(k)||0) + 1); }
  askConfirm(
    "Price " + nf0.format(todo.length) + " parcels from the lane rates?",
    [...byLane.entries()].map(([k,v]) => nf0.format(v) + " on " + k).join(", ") + ". " +
    "The total goes from " + money(before) + " to " + money(after) + ". " +
    (unbilled ? nf0.format(unbilled) + " of them have no charge at all yet. " : "") +
    "This replaces the charge on every one of them, including any you typed by hand. " +
    "Parcels outside a priced lane are left alone.",
    "Price them", runLanePrice);
}

async function runLanePrice(){
  const todo = allItems().filter(it => laneCost(it) != null);
  if(!todo.length || !S.db) return;
  const prog = openProgress(todo.length, "Pricing from lane rates");
  let done = 0, failed = 0, firstErr = "", idx = 0;
  const t = now();
  const worker = async () => {
    while(idx < todo.length){
      const it = todo[idx++];
      const b = {...it}; delete b.id;
      b.cost = laneCost(it);
      b.currency = "USD";
      b.updatedAt = t;
      b.updatedBy = S.meId || "";
      try{ await S.db.doc("items/" + it.id).set(b); }
      catch(e){
        failed++;
        if(!firstErr) firstErr = (e && e.code) || "error";
        if(failed > 25 || firstErr === "quota_exceeded") idx = todo.length;
      }
      done++;
      if(done % 20 === 0 || done === todo.length) prog.set(done);
    }
  };
  await Promise.all(Array.from({ length:6 }, worker));
  prog.close();
  const ok = done - failed;
  if(ok) pushFeed({ t:now(), by:S.meId||"", bc:"Priced from lane rates",
                    nm:nf0.format(ok) + " parcels repriced", from:"", to:"", loc:"" });
  toast(failed
    ? nf0.format(ok) + " priced, " + failed + " failed (" + firstErr + ")."
    : nf0.format(ok) + " parcels priced from their lane.", failed ? "bad" : null);
  render();
}

function askRecalc(){
  const rate = Number(S.cfg.cnyPerUsd) || 0;
  if(!rate){ toast("Set a yuan rate above and save it first.","bad"); return; }
  const todo = allItems().filter(it => (Number(it.cny)||0) > 0);
  if(!todo.length){ toast("No items carry an original ￥ amount."); return; }
  const before = todo.reduce((s,i) => s + (Number(i.cost)||0), 0);
  const after  = todo.reduce((s,i) => s + (Number(i.cny)||0) / rate, 0);
  askConfirm(
    "Recalculate " + nf0.format(todo.length) + " charges at ￥" + rate + " per USD?",
    "The total goes from " + money(before) + " to " + money(after) + ". Every item holding an " +
    "original ￥ amount is rebuilt from it, so a charge you typed over by hand would be replaced. " +
    "Items with no ￥ amount are left alone.",
    "Recalculate", runRecalc);
}

async function runRecalc(){
  const rate = Number(S.cfg.cnyPerUsd) || 0;
  if(!rate || !S.db) return;
  const todo = allItems().filter(it => (Number(it.cny)||0) > 0);
  if(!todo.length) return;

  const prog = openProgress(todo.length, "Recalculating charges");
  let done = 0, failed = 0, firstErr = "", idx = 0;
  const worker = async () => {
    while(idx < todo.length){
      const it = todo[idx++];
      const b = {...it};
      delete b.id;
      b.cost = +((Number(it.cny)||0) / rate).toFixed(2);
      b.currency = "USD";
      b.updatedAt = now();
      b.updatedBy = S.meId || "";
      try{ await S.db.doc("items/" + it.id).set(b); }
      catch(e){
        failed++;
        if(!firstErr) firstErr = (e && e.code) || "error";
        if(failed > 25) idx = todo.length;
      }
      done++;
      if(done % 20 === 0 || done === todo.length) prog.set(done);
    }
  };
  await Promise.all(Array.from({ length:6 }, worker));
  prog.close();

  const ok = done - failed;
  if(ok) pushFeed({ t:now(), by:S.meId||"", bc:"Charges recalculated",
                    nm:nf0.format(ok) + " items at ￥" + rate + " per USD",
                    from:"", to:"", loc:"" });
  toast(failed
    ? nf0.format(ok) + " updated, " + failed + " failed (" + firstErr + ")."
    : nf0.format(ok) + " charges recalculated at ￥" + rate + " per USD.", failed ? "bad" : null);
  render();
}

/* Where a sheet has several columns a field could take, the exact header wins. */
const PREFER = {
  barcode:["ordernumber"], name:["packageitemname"], customer:["username"],
  parcel:["shipment"], qty:["packageitemquantity"], weightKg:["outboundactualweightkg"],
  cbm:["outboundvolumem"], cny:["actualpaymentamount"], shelf:["packagelocation"],
  origin:["warehouse"], route:["routename"], notes:["warehouseremark"],
};
const key = s => String(s||"").toLowerCase().replace(/[^a-z0-9一-鿿]/g,"");

function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  const t = String(text).replace(/\r\n?/g,"\n");
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){
      if(ch==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    } else if(ch==='"'){ q=true; }
    else if(ch===","||ch===";"||ch==="\t"){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); cell=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; }
    else cell+=ch;
  }
  row.push(cell);
  if(row.some(c=>c.trim()!=="")) rows.push(row);
  return rows;
}
function guessMap(headers){
  const m = {}, keys = headers.map(key), taken = new Set();
  for(const fld in PREFER){
    for(const want of PREFER[fld]){
      const i = keys.indexOf(key(want));
      if(i >= 0 && !taken.has(i)){ m[fld] = i; taken.add(i); break; }
    }
  }
  keys.forEach((k,i) => {
    if(!k || taken.has(i)) return;
    for(const fld in ALIAS){
      if(m[fld] != null) continue;
      if(ALIAS[fld].some(a => key(a) === k)){ m[fld] = i; taken.add(i); return; }
    }
  });
  return m;
}

  if(S.importMap.barcode==null)
    c.append(banner("","Barcode column needed.","Pick which column holds the barcode — it is how items are identified."));
  return c;
}
function takeRows(rows){
  const clean = (rows||[]).filter(r => Array.isArray(r) && r.some(cell => String(cell??"").trim() !== ""));
  if(clean.length < 2){ toast("That file has no data rows.","bad"); return; }

  render();
}
function takeCsv(text){ takeRows(parseCsv(text)); }

/** Reads .xlsx/.xls through SheetJS; anything else as plain text. */
function loadFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onerror = () => toast("Could not read that file.","bad");
  if(/\.xlsx?$/i.test(file.name||"")){
    if(!window.XLSX){
      toast("The Excel reader did not load. Open the file in Excel and use Save As → CSV.","bad");
      return;
    }
    r.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(r.result), { type:"array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        if(!sheet){ toast("That workbook has no sheets.","bad"); return; }
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:"" });
        takeRows(rows.map(row => (row||[]).map(cell => cell==null ? "" : String(cell))));
      }catch(_){
        toast("Could not read that Excel file. Try Save As → CSV instead.","bad");
      }
    };
    r.readAsArrayBuffer(file);
    return;
  }
  r.onload = () => takeCsv(String(r.result));
  r.readAsText(file);
}
function normStatus(s){
  const k = key(s);
  if(!k) return null;
  for(const st of ORDER) if(key(STATUS[st].label)===k || st===k) return st;
  if(/(transit|way|china|notarriv|pending|order)/.test(k)) return "expected";
  if(/(arriv|receiv|warehouse|hub|unload|shipping)/.test(k)) return "received";
  if(/(shelf|shelv|stored|putaway|stock)/.test(k)) return "shelved";
  if(/(out|release|driver|dispatch|transit)/.test(k)) return "released";
  if(/(deliver|done|complete|collect)/.test(k)) return "delivered";
  return null;
}
function truthy(s){
  const k = key(s);
  return ["1","yes","y","true","paid","ok","done","settled","t"].includes(k);
}
function openProgress(total, title){
  closeModal();

  bar.append(fill);

  note.style.fontSize="12px";

}

async function runImport(headers, data){
  const m = S.importMap;
  if(m.barcode == null){ toast("Pick the barcode column first.","bad"); return; }
  if(!S.db){ toast("No connection to the database.","bad"); return; }

  const asStatus = STATUS[S.importStatus] ? S.importStatus : "received";
  const asZone = S.importZone || "";
  const rate = Number(S.cfg.cnyPerUsd) || 0;
  const num = s => { const n = parseFloat(String(s).replace(/[^\d.-]/g,"")); return isFinite(n) ? n : 0; };

  const jobs = new Map();   // keyed by doc id, so a repeated order number collapses to one write
  let noBarcode = 0, dupes = 0;

  for(const row of data){
    const cell = fld => (m[fld] != null && row[m[fld]] != null) ? String(row[m[fld]]).trim() : "";
    const bc = normBc(cell("barcode"));
    if(!bc){ noBarcode++; continue; }
    const id = docId(bc);
    if(jobs.has(id)) dupes++;

    const prev = jobs.get(id) || (S.items.get(id)
      ? (() => { const x = {...S.items.get(id)}; delete x.id; return x; })() : null);
    const b = prev || blankItem(bc);
    const txt = (fld, target) => { const v = cell(fld); if(v) b[target||fld] = v; };

    txt("name"); txt("clientId"); txt("customer"); txt("parcel");
    txt("itemId"); txt("origin"); txt("route"); txt("notes");
    // some exports lose the country code and leave a leading dash
    const ph = cell("phone").replace(/^[-\s]+/, "").trim();
    if(ph) b.phone = ph;
    if(cell("shelf")) b.shelf = cell("shelf").toUpperCase();
    if(cell("zone"))  b.zone  = cell("zone").toUpperCase();
    if(cell("qty"))      b.qty      = num(cell("qty"));
    if(cell("weightKg")) b.weightKg = num(cell("weightKg"));
    if(cell("declared")) b.declared = num(cell("declared"));

    // Volume: an explicit CBM column if present, otherwise derived from the box dimensions,
    // which avoids the chargeable column meaning CBM on sea routes and kilos on air.
    let cbm = num(cell("cbm"));
    const L = num(cell("lenCm")), W = num(cell("widCm")), H = num(cell("hgtCm"));
    if(L && W && H){
      b.dims = L + "×" + W + "×" + H + " cm";
      if(!cbm) cbm = +((L * W * H) / 1e6).toFixed(6);
    } else {
      // other exports give the box as one "51*30*16" string instead of three columns
      const parts = cell("sizeLWH").split(/[*x×X,\s]+/).map(num).filter(n => n > 0);
      if(parts.length === 3){
        b.dims = parts[0] + "×" + parts[1] + "×" + parts[2] + " cm";
        if(!cbm) cbm = +((parts[0] * parts[1] * parts[2]) / 1e6).toFixed(6);
      }
    }
    if(cbm) b.cbm = cbm;

    // Charge: yuan converted at the rate in Setup, unless an explicit USD column is mapped.
    const cny = num(cell("cny"));
    if(cny){ b.cny = cny; if(rate > 0) b.cost = +(cny / rate).toFixed(2); }
    if(cell("cost")) b.cost = num(cell("cost"));

    // Paid: a real "paid at" date means settled; cash on delivery means not yet.
    // the dashboard's own dates, kept as they are: neither is a Lebanon arrival
    const shippedAt = parseStamp(cell("shippedAtRaw"));
    if(shippedAt) b.shippedAt = shippedAt;
    const inboundAt = parseStamp(cell("inboundAtRaw"));
    if(inboundAt) b.inboundAt = inboundAt;

    const paidAt = cell("paidAtRaw"), pm = cell("payMethod");
    if(pm) b.payMethod = pm;
    if(m.paidAtRaw != null) b.paid = !!paidAt;
    if(!paidAt && /cash on delivery|\bcod\b|unpaid|not paid/i.test(pm)) b.paid = false;
    else if(m.paidAtRaw == null && /\bpaid\b|settled|prepaid/i.test(pm)) b.paid = true;
    else if(m.paidAtRaw == null && m.payMethod != null && truthy(pm)) b.paid = true;

    if(!prev){
      b.demo = false;
      b.status = asStatus;
      if(m.status != null){ const st = normStatus(cell("status")); if(st) b.status = st; }
      if(!b.zone && asZone) b.zone = asZone;
      const t = now();
      if(b.status !== "expected" && !b.receivedAt) b.receivedAt = t;
      if(b.status === "shelved")   b.shelvedAt = t;
      if(b.status === "released")  b.releasedAt = t;
      if(b.status === "delivered") b.deliveredAt = t;
      b.hist = [{ t, by:S.meId||"", from:"", to:b.status,
                  loc:b.shelf||b.zone||"", note:"imported from dashboard export" }];
    }
    b.updatedAt = now();
    b.updatedBy = S.meId || "";
    jobs.set(id, b);
  }

  const list = [...jobs.entries()];
  if(!list.length){ toast("No row in that file had a barcode.","bad"); return; }

  // Write with a little concurrency — one write per document, several documents at once.
  const prog = openProgress(list.length);
  let done = 0, failed = 0, firstErr = "", idx = 0;
  const worker = async () => {
    while(idx < list.length){
      const [id, body] = list[idx++];
      try{ await S.db.doc("items/" + id).set(body); }
      catch(e){
        failed++;
        if(!firstErr) firstErr = (e && e.code) || "error";
        if(failed > 25 || firstErr === "quota_exceeded") idx = list.length;
      }
      done++;
      if(done % 15 === 0 || done === list.length) prog.set(done);
    }
  };
  await Promise.all(Array.from({ length:6 }, worker));
  prog.close();

  const ok = done - failed;
  S.importRows = null; S.importMap = null;
  pushFeed({ t:now(), by:S.meId||"", bc:"Dashboard import",
             nm:ok + " item" + (ok===1?"":"s") + " loaded",
             from:"", to:asStatus, loc:asZone });

  const extra = [];
  if(noBarcode) extra.push(noBarcode + " row" + (noBarcode===1?"":"s") + " had no barcode");
  if(dupes)     extra.push(dupes + " repeated order number" + (dupes===1?"":"s") + " merged");
  if(failed)    extra.push(failed + " failed (" + firstErr + ")");
  toast(nf0.format(ok) + " items imported" + (extra.length ? " — " + extra.join(", ") : "."),
        failed ? "bad" : null);
  render();
}

function csvCell(v){
  const s = v==null ? "" : String(v);
  return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function itemsToCsv(items){
  const cols = ["barcode","name","itemId","clientId","parcel","customer","phone","status","zone","shelf",
                "qty","weightKg","cbm","dims","cny","cost","currency","paid","payMethod","origin","route",
                "inboundAt","shippedAt","receivedAt","shelvedAt","deliveredAt","daysHeld","notes"];
  const head = ["Barcode","Item name","Item ID","Client ID","Shipment","Client","Phone","Status","Zone","Shelf",
                "Quantity","Weight kg","CBM","Box size","Amount CNY","Charge USD","Currency","Paid","Payment method",
                "Shipped from","Route","Into China warehouse","Shipped from China",
                "Received","Shelved","Delivered","Days held","Notes"];
  const lines = [head.map(csvCell).join(",")];
  for(const it of items){
    lines.push(cols.map(c => {
      if(c==="status") return csvCell(STATUS[it.status]?.label || it.status);
      if(c==="paid") return csvCell(it.paid ? "Yes" : "No");
      if(c==="daysHeld"){ const d=ageDays(it); return csvCell(d==null?"":d); }
      if(/At$/.test(c)) return csvCell(it[c] ? new Date(it[c]).toISOString().slice(0,10) : "");
      return csvCell(it[c]);
    }).join(","));
  }
  return lines.join("\n");
}
async function exportCsv(items, tag){
  if(!items || !items.length){ toast("Nothing to export."); return; }
  const name = (tag||"items").replace(/[^A-Za-z0-9_-]+/g,"-").toLowerCase() +
               "-" + new Date().toISOString().slice(0,10) + ".csv";
  await offerFile(name, "﻿" + itemsToCsv(items));
}
async function exportZones(){
  const zs = [...S.zones.values()];
  if(!zs.length){ toast("No zones to export."); return; }
  const lines = [["Code","Name","Type","Capacity","Items now","Note"].join(",")];
  for(const z of zs) lines.push([z.code,z.name,z.kind,z.capacity||"",zoneCount(z.code),z.note||""].map(csvCell).join(","));
  await offerFile("zones-"+new Date().toISOString().slice(0,10)+".csv", "﻿"+lines.join("\n"));
}
async function offerFile(filename, data){
  if(!S.dl){ toast("Saving files is not available in this view.","bad"); return; }
  try{
    await S.dl.save({ filename, data });
    toast("Saved "+filename+".");
  }catch(e){
    const c = e && e.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast("Wait a moment, then try the export again.","bad");
    else toast("Could not save that file.","bad");
  }
}

  kv("Shipment", it.parcel || "—");

  if(it.route) kv("Route", it.route);

  kv("Volume", (Number(it.cbm)||0) ? nf3.format(it.cbm)+" CBM" : "—");
  if(it.dims) kv("Box size", it.dims);
  kv("Charge", (Number(it.cost)||0) ? money(it.cost)+"  ·  "+lbp(it.cost) : "—");
  const lane = laneFor(it);
  if(lane){
    const qty = lane.basis === "cbm" ? (Number(it.cbm)||0) : (Number(it.weightKg)||0);
    const unit = lane.basis === "cbm" ? " m³" : " kg";
    kv("Lane", (lane.label || lane.match) + "  ·  " + money(lane.price) + " per" + unit +
       (qty ? "  ×  " + qty + unit + "  =  " + money(laneCost(it)) : "  (no " + unit.trim() + " recorded)"));
  }
  if(Number(it.cny)||0) kv("Dashboard amount", "￥" + nf2.format(it.cny));
  if(it.payMethod) kv("Payment method", it.payMethod);
  if(Number(it.declared)||0) kv("Declared value", nf2.format(it.declared));
  kv("Received", fmtDate(it.receivedAt));
  if(it.shelvedAt)   kv("Shelved", fmtDate(it.shelvedAt));
  if(it.releasedAt)  kv("Released", fmtDate(it.releasedAt));
  if(it.deliveredAt) kv("Delivered", fmtDate(it.deliveredAt));
  // the dashboard's own dates. Neither is an arrival in Lebanon; it exports none.
  if(it.inboundAt) kv("Into China warehouse", fmtDate(it.inboundAt));
  if(it.shippedAt){
    const days = Math.floor((now() - it.shippedAt) / 86400000);
    kv("Shipped from China", fmtDate(it.shippedAt) +
      (it.inboundAt ? "  ·  " + Math.round((it.shippedAt - it.inboundAt)/86400000) +
        " days after it arrived there" : "") +
      (it.status === "expected" ? "  ·  " + nf0.format(days) + " days ago" : ""));
  }
  const held = ageDays(it);
  if(held != null && it.status !== "expected"){
    const basis = ageBasis(it);
    kv("Days held", nf0.format(held) +
      (isLongStay(it) ? "  (here too long)" : isLate(it) ? "  (over free days)" : "") +
      // say where the number came from, since the sources mean different things
      (basis ? "  ·  counted from " + basis.label + ", " + fmtDate(basis.t) : ""));

    body.append(mg);

    body.append(el("hr","sep"));

    pb.type="button";
    pb.addEventListener("click", async () => {

      try{ await saveItem(id,b); toast(b.paid?"Marked paid.":"Marked unpaid."); openDrawer(id); }catch(_){}
    });
    pr.append(pb);
    body.append(pr);
  }

  // history
  body.append(el("hr","sep"));
  const hr3 = el("div","hr-t"); hr3.append(el("span","sect-t","History")); body.append(hr3);
  const hs = el("div","hist");

  for(const e of hist){
    const r = el("div","hi");
    r.append(el("div","ht", fmtTime(e.t)));
    const b = el("div","hb");
    b.append(el("b",null, (e.from ? STATUS[e.from]?.label+" → " : "Added as ") + (STATUS[e.to]?.label || e.to)));
    const s = el("span");
    const nmS = el("span"); nmS.dataset.uid = e.by||""; nmS.textContent = nameOf(e.by);
    s.append(nmS);
    if(e.loc) s.append(document.createTextNode(" · "+e.loc));
    if(e.note) s.append(document.createTextNode(" · "+e.note));
    b.append(s); r.append(b); hs.append(r);
  }
  body.append(hs);
  d.append(body);

  const foot = el("div","dfoot");
  if(writable()){
    const ed = el("button","btn pri","Edit details"); ed.type="button";
    ed.addEventListener("click", () => { closeDrawer(); editItem(id); });
    foot.append(ed);
    const del = el("button","btn dgr","Delete"); del.type="button";
    del.addEventListener("click", () => {
      closeDrawer();
      askConfirm("Delete this record?", it.barcode+(it.name?" — "+it.name:"")+" will be removed for good. The goods themselves are not affected.",
        "Delete", async () => {
          try{ await write("items/"+id, () => S.db.doc("items/"+id).delete()); toast("Record deleted."); }catch(_){}
        });
    });
    foot.append(del);
  }
  const cl = el("button","btn","Close"); cl.type="button";
  cl.style.marginLeft="auto";
  cl.addEventListener("click", () => closeDrawer());
  foot.append(cl);
  d.append(foot);

  document.body.append(scrim, d);
  resolveProfiles(hist.map(e=>e.by).filter(Boolean));
  x.focus();
}

      if(!laneFor(tmp) && S.cfg.rateMode==="manual"){
        toast("Set a lane price, or a CBM or kg rate, in Setup first."); return; }
      f.cost.value = calcCost(tmp);
    }},
    { label:"Cancel", cls:"btn", fn:closeModal },
    { label:"Save", cls:"btn pri", fn: async () => {
      const b = {...it}; delete b.id;
      b.name=f.name.value.trim(); b.itemId=f.itemId.value.trim(); b.parcel=f.parcel.value.trim();
      b.customer=f.customer.value.trim(); b.phone=f.phone.value.trim(); b.notes=f.notes.value.trim();
      b.weightKg=+f.weightKg.value||0; b.cbm=+f.cbm.value||0; b.cost=+f.cost.value||0;
      try{ await saveItem(id,b); closeModal(); toast("Saved."); openDrawer(id); }catch(_){}
    }},
  ]);
  setTimeout(()=>f.name.focus(),30);
}

/* ===================== first load from the bundled export ===================== */
/* The dashboard export ships as a file beside this page. Anything in it that the
   database does not already hold can be written in one pass; barcodes already
   present are left exactly as the floor last scanned them. */

/* A bare relative URL resolves against the page's own address, which is not
   guaranteed to sit at the artifact root, so try the obvious candidates and
   report what happened instead of failing quietly. */
async function loadSeedManifest(){
  const tries = ["seed-items.json", "./seed-items.json", "/seed-items.json"];
  const notes = [];
  for(const u of tries){
    try{
      const r = await fetch(u);
      if(!r.ok){ notes.push(u + " → HTTP " + r.status); continue; }
      const arr = await r.json();
      if(!Array.isArray(arr) || !arr.length){ notes.push(u + " → no records"); continue; }
      S.seed = arr.filter(d => d && d._id);
      S.seedErr = "";
      recountSeed();
      render();
      return;
    }catch(e){
      notes.push(u + " → " + ((e && e.message) || "blocked"));
    }
  }
  S.seed = null; S.seedPending = 0;
  S.seedErr = notes.join(" · ");
  render();
}

function seedErrCard(){
  const b = el("div","banner");
  b.append(el("b",null,"Could not read the bundled export."));
  b.append(el("span",null," " + S.seedErr));
  const again = el("button","btn sm","Try again"); again.type="button";
  again.addEventListener("click", () => { S.seedErr=""; render(); loadSeedManifest(); });
  b.append(again);
  return b;
}

function recountSeed(){
  if(!S.seed){ S.seedPending = 0; return; }
  let n = 0;
  for(const d of S.seed) if(!S.items.has(d._id)) n++;
  S.seedPending = n;
}

function seedCard(){
  const b = el("div","banner");
  b.append(el("b",null, nf0.format(S.seedPending) + " item" + (S.seedPending===1?"":"s") +
                        " from your dashboard export are ready to load."));
  // a bundle carries its own statuses and locations, so say what is in this one
  const pend = S.seed ? S.seed.filter(d => !S.items.has(d._id)) : [];
  const located = pend.filter(d => d.status === "shelved" && d.shelf).length;
  const coming  = pend.filter(d => d.status === "expected").length;
  b.append(el("span",null,
    coming === pend.length
      ? " They go in as not here yet — still on the way from China, so nothing to put on a shelf." +
        " Scan one when it arrives and it moves itself into the warehouse."
      : located
        ? " " + nf0.format(located) + " of them were found on a shelf by the floor scan and go in at" +
          " that location; the rest go in as in the warehouse. Barcodes already here are left untouched."
        : " They go in as received in the shipping department, with charges converted from ￥." +
          " Barcodes already here are left untouched."));
  const go = el("button","btn sm pri", S.seedBusy ? "Loading…" : "Load now");
  go.type = "button";
  go.disabled = S.seedBusy;
  go.addEventListener("click", runSeed);
  b.append(go);
  return b;
}

async function runSeed(){
  if(!S.seed || S.seedBusy || !S.db) return;
  const todo = S.seed.filter(d => !S.items.has(d._id));
  if(!todo.length){ recountSeed(); render(); return; }

  S.seedBusy = true; render();
  const prog = openProgress(todo.length);
  let done = 0, failed = 0, firstErr = "", idx = 0;
  const worker = async () => {
    while(idx < todo.length){
      const d = todo[idx++];
      const body = {...d};
      delete body._id;
      try{ await S.db.doc("items/" + d._id).set(body); }
      catch(e){
        failed++;
        if(!firstErr) firstErr = (e && e.code) || "error";
        if(failed > 25 || firstErr === "quota_exceeded") idx = todo.length;
      }
      done++;
      if(done % 20 === 0 || done === todo.length) prog.set(done);
    }
  };
  await Promise.all(Array.from({ length:6 }, worker));
  prog.close();
  S.seedBusy = false;

  const ok = done - failed;
  // log what they actually went in as, not an assumed status
  const went = {};
  for(const d of todo) went[d.status || "received"] = (went[d.status||"received"]||0) + 1;
  const only = Object.keys(went).length === 1 ? Object.keys(went)[0] : "";
  if(ok) pushFeed({ t:now(), by:S.meId||"", bc:"Dashboard import",
                    nm:nf0.format(ok) + " items loaded" +
                       (only ? "" : " (" + Object.entries(went)
                         .map(([k,v]) => nf0.format(v) + " " + (STATUS[k] ? STATUS[k].label.toLowerCase() : k))
                         .join(", ") + ")"),
                    from:"", to:only || "", loc:"" });
  toast(failed
    ? nf0.format(ok) + " loaded, " + failed + " failed (" + firstErr + ")."
    : nf0.format(ok) + " items loaded into the warehouse.", failed ? "bad" : null);
  render();
}

/* ---------------------------- bulk updates ----------------------------
   A bundled list of changes to parcels that already exist: a shelf found by
   the floor scan, a status that moved on in the dashboard, or both. Each
   entry carries only the fields it means to change, so a parcel's client,
   charge and paid state are never touched by a pass like this. An entry that
   already matches the record is skipped, which makes a re-run after an
   interrupted load cost only what is left.

   Entry shape: { _id, shelf?, zone?, status?, set?, label?, note? }
   `set` carries any other fields to write, already merged against what the
   record holds, so a refreshed export can be applied without the field-by-
   field rules having to live in two places. */
async function loadUpdates(){
  for(const u of ["updates.json", "./updates.json", "/updates.json"]){
    try{
      const r = await fetch(u);
      if(!r.ok) continue;
      const arr = await r.json();
      if(!Array.isArray(arr) || !arr.length) continue;
      S.ups = arr.filter(d => d && d._id &&
        (d.shelf !== undefined || d.zone !== undefined || d.status ||
         (d.set && typeof d.set === "object")));
      recountUps();
      render();
      return;
    }catch(_){}
  }
  S.ups = null; S.upPending = 0;
}

function upTodo(){
  if(!S.ups) return [];
  return S.ups.filter(d => {
    const it = S.items.get(d._id);
    if(!it) return false;                                   // nothing to update
    if(d.shelf  !== undefined && it.shelf  !== d.shelf) return true;
    if(d.zone   !== undefined && it.zone   !== d.zone)  return true;
    if(d.status && STATUS[d.status] && it.status !== d.status) return true;
    if(d.set) for(const k in d.set)
      if(JSON.stringify(it[k]) !== JSON.stringify(d.set[k])) return true;
    return false;
  });
}

function recountUps(){ S.upPending = upTodo().length; }

/* every entry in a bundle carries the same label, so the first one names the job */
function upLabel(){
  const d = (S.ups || []).find(x => x.label);
  return d ? d.label : "bundled change";
}

function upCard(){
  const b = el("div","banner");
  b.append(el("b",null, nf0.format(S.upPending) + " parcel" + (S.upPending===1?"":"s") +
                        " are waiting on a bundled update."));
  b.append(el("span",null, " " + upLabel() + ". Only the location and status change —" +
                           " clients, charges and paid status are left alone."));
  const go = el("button","btn sm pri", S.upBusy ? "Applying…" : "Apply updates");
  go.type = "button";
  go.disabled = S.upBusy;
  go.addEventListener("click", runUpdates);
  b.append(go);
  return b;
}

async function runUpdates(){
  if(S.upBusy || !S.db) return;
  const todo = upTodo();
  if(!todo.length){ recountUps(); render(); return; }

  S.upBusy = true; render();
  const prog = openProgress(todo.length, "Applying updates");
  let done = 0, failed = 0, firstErr = "", idx = 0;
  const t = now();
  const worker = async () => {
    while(idx < todo.length){
      const d = todo[idx++];
      const it = S.items.get(d._id);
      if(!it){ done++; continue; }
      const b = {...it};
      delete b.id;
      const from = b.status;
      // anything the bundle carries wins; it was merged against this record already
      if(d.set) for(const k in d.set){ if(k !== "id" && k !== "hist") b[k] = d.set[k]; }
      if(d.shelf !== undefined){
        b.shelf = d.shelf;
        // fall back to the label's own leading letter if zones are not set up yet
        b.zone  = d.shelf ? (zoneForShelf(d.shelf) ||
                             (/^[A-Z]/.test(d.shelf) ? d.shelf[0] : b.zone)) : "";
      }
      if(d.zone !== undefined) b.zone = d.zone;
      if(d.status && STATUS[d.status]){
        b.status = d.status;
        if(b.status !== "expected" && !b.receivedAt) b.receivedAt = t;
        if(b.status === "shelved")   b.shelvedAt   = t;
        if(b.status === "released")  b.releasedAt  = t;
        if(b.status === "delivered") b.deliveredAt = t;
      }
      b.updatedAt = t;
      b.updatedBy = S.meId || "";
      b.hist = [{ t, by:S.meId||"", from, to:b.status,
                  loc:b.shelf||b.zone||"", note:d.note || "bundled update" },
                ...(it.hist||[])].slice(0,HIST_MAX);
      try{ await S.db.doc("items/" + d._id).set(b); }
      catch(e){
        failed++;
        if(!firstErr) firstErr = (e && e.code) || "error";
        if(failed > 25 || firstErr === "quota_exceeded") idx = todo.length;
      }
      done++;
      if(done % 20 === 0 || done === todo.length) prog.set(done);
    }
  };
  await Promise.all(Array.from({ length:6 }, worker));
  prog.close();
  S.upBusy = false;

  const ok = done - failed;
  if(ok) pushFeed({ t:now(), by:S.meId||"", bc:upLabel(),
                    nm:nf0.format(ok) + " parcels updated", from:"", to:"", loc:"" });
  toast(failed
    ? nf0.format(ok) + " updated, " + failed + " failed (" + firstErr + ")."
    : nf0.format(ok) + " parcels updated.", failed ? "bad" : null);
  render();
}

/* ============================== boot ============================== */

function wireChrome(){
  $("#fab").addEventListener("click", () => go("scan"));
  $("#setupBtn").addEventListener("click", () => go("setup"));
  const bb = $("#beepBtn");
  bb.addEventListener("click", () => {
    S.beep = !S.beep;
    bb.setAttribute("aria-pressed", String(S.beep));
    try{ localStorage.setItem("ch.beep", S.beep?"1":"0"); }catch(_){}
    if(S.beep) ping(true);
  });
  try{ const b = localStorage.getItem("ch.beep"); if(b==="0"){ S.beep=false; bb.setAttribute("aria-pressed","false"); } }catch(_){}

  const q = $("#quick");
  /* This box finds across the whole warehouse, so it drops the chips and
     drill-ins first. Left in place they narrow the search to the slice already on
     screen: pick On shelf or open a shipment, then look up an id, and a parcel
     that is plainly in stock reads as missing. The box in the Stock toolbar is
     the one that refines a slice. */
  q.addEventListener("input", () => {
    S.filters = { status:"", zone:"", paid:"", q:q.value, parcel:"" };
    if(S.tab!=="stock"){ S.tab="stock"; renderTabs(); }
    render(); q.focus();
  });
  q.addEventListener("keydown", e => {
    if(e.key!=="Enter") return;
    const hit = findOne(q.value);
    if(hit) openDrawer(hit.id);
  });

  document.addEventListener("keydown", e => {
    if(e.key==="Escape"){ closeModal(); closeDrawer(); return; }
    const tag = (e.target && e.target.tagName) || "";
    if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if(e.key==="/"){ e.preventDefault(); go("scan"); return; }
    const i = "12345678".indexOf(e.key);
    if(i >= 0 && TABS[i]){ e.preventDefault(); go(TABS[i][0]); }
  });

  // the table/card swap is decided at build time, so redraw when the breakpoint is crossed
  let wasPhone = isPhone();
  window.addEventListener("resize", () => {
    const p = isPhone();
    if(p !== wasPhone){ wasPhone = p; render(); }
  });

  try{
    const h = location.hash.replace(/^#/,"");
    if(TABS.some(t => t[0]===h)) S.tab = h;
  }catch(_){}
}

function applyItems(snap){
  const m = new Map();
  snap.docs.forEach(d => {
    if(!d.exists) return;
    const v = d.data() || {};
    const status = STATUS[v.status] ? v.status : "received";
    m.set(d.id, { ...v, id:d.id, status });
  });
  S.items = m;
  recountSeed();
  recountUps();
  if(!S.recvZone){
    const stg = [...S.zones.values()].find(z => z.kind==="staging");
    if(stg) S.recvZone = stg.code;
  }
  render();
  if(S.openId && S.items.has(S.openId) && $("#drawer")) openDrawer(S.openId);
}

async function boot(){
  wireChrome();
  render();

  const db = await window.claude?.use?.("db").catch(()=>null);
  const user = await window.claude?.use?.("user").catch(()=>null);
  S.dl = await window.claude?.use?.("downloads").catch(()=>null);

  if(user){
    S.user = user;
    try{
      const me = await user.me();
      S.meId = me.id || null;
      if(me.id){
        const w = $("#who"); w.hidden = false;
        $("#whoAv").src = me.avatarUrl; $("#whoNm").textContent = me.name || "You";
      }
    }catch(_){}
    try{ S.canWrite = await user.can("data.write"); }catch(_){ S.canWrite = null; }
  }

  if(!db){
    S.ready = false;
    render();
    const m = $("#main");
    m.textContent = "";
    const v = el("section","view");
    v.append(banner("ro","This view cannot reach the warehouse database.",
      "Open the artifact from your Claude account — signed out, or in a preview, records cannot be read or saved."));
    v.append(emptyState("box","No connection to your records",
      "The scan station, zones and reports all read from the shared database. Once you open this page while signed in, your data appears here."));
    m.append(v);
    return;
  }

  S.db = db; S.ready = true;

  db.collection("items").onSnapshot(applyItems, e => {
    if(e.code==="revoked" || e.code==="not_granted") toast("Access to the records ended.","bad");
    else toast("Lost the live connection to stock. Reload to reconnect.","bad");
  });
  db.collection("zones").onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { if(!d.exists) return; const v=d.data()||{}; m.set(d.id, {...v, id:d.id, code:v.code||d.id}); });
    S.zones = m;
    if(!S.recvZone){ const stg=[...m.values()].find(z=>z.kind==="staging"); if(stg) S.recvZone=stg.code; }
    if(!S.dest.zone){ const sh=[...m.values()].find(z=>z.kind==="shelf"); if(sh) S.dest.zone=sh.code; }
    render();
  }, ()=>{});
  db.doc("meta/settings").onSnapshot(snap => {
    S.cfg = { ...DEFAULTS, ...(snap.exists ? snap.data() : {}) };
    render();
  }, ()=>{});
  db.doc("meta/feed").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    S.feed = Array.isArray(d?.entries) ? d.entries : [];
    render();
  }, ()=>{});

  loadSeedManifest();
  loadUpdates();
  if(S.tab==="scan") setTimeout(focusScan, 300);
}

boot();
})();
</script>
